name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Maven verify
        run: ./mvnw verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --dir /tmp/gitleaks
          tar -xzf /tmp/gitleaks/*.tar.gz -C /tmp/gitleaks
      - name: Scan full history
        run: /tmp/gitleaks/gitleaks git --redact --log-opts="--all --full-history"

  compose:
    name: PostgreSQL and browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start clean stack
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 300
      - name: Install browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify complete browser workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify Postman collection
        working-directory: frontend
        run: npm exec --yes --package=newman@6.2.1 -- newman run ../postman/Job-Board-API.postman_collection.json
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > container-logs.txt
      - name: Reject backend server errors
        run: |
          if docker compose logs backend | grep -E 'Unhandled API exception| ERROR '; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-container-results
          path: |
            frontend/test-results/
            container-logs.txt
      - name: Stop stack
        if: always()
        run: docker compose down
