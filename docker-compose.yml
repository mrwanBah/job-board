# Job Board — full-stack orchestration (SKELETON).
# frontend + mysql are owned by Moayad; the backend service is a DRAFT using
# standard Spring Boot defaults and must be confirmed against Marwan's setup.
# Full Dockerfiles + nginx wiring land in Week 3.

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jobboard}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CONFIRM W/ MARWAN: build context path, exposed port, and datasource env var names.
  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-jobboard}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      # VITE_API_URL is build-time for Vite — passed as a build arg in
      # frontend/Dockerfile (Week 3), not a runtime env.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "5173:80" # nginx serves the built SPA on port 80

volumes:
  mysql_data:
