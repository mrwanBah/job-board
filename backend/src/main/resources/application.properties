spring.application.name=backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/jobboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobboard_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobboard_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:change-this-development-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}
