<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#f8fafc" />

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Job Board — Architecture</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Local development (Docker Compose)</text>

  <!-- Browser -->
  <rect x="360" y="90" width="180" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Browser</text>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#6b7280">User (Applicant / Company)</text>

  <!-- Docker Compose boundary -->
  <rect x="60" y="210" width="780" height="300" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5" />
  <text x="80" y="234" font-size="13" font-weight="700" fill="#4b5563">docker-compose.yml</text>

  <!-- Frontend -->
  <rect x="100" y="260" width="210" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="205" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">frontend</text>
  <text x="205" y="308" text-anchor="middle" font-size="11" fill="#4338ca">nginx:alpine</text>
  <text x="205" y="324" text-anchor="middle" font-size="11" fill="#4338ca">React + TypeScript SPA</text>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#4338ca">Vite build (static)</text>
  <text x="205" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#6366f1">host :5173 -&gt; :80</text>

  <!-- Backend -->
  <rect x="345" y="260" width="210" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="450" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">backend</text>
  <text x="450" y="308" text-anchor="middle" font-size="11" fill="#047857">Spring Boot REST API</text>
  <text x="450" y="324" text-anchor="middle" font-size="11" fill="#047857">JWT auth · Swagger</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#047857">eclipse-temurin (jdk-&gt;jre)</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">host :8080</text>

  <!-- PostgreSQL -->
  <rect x="590" y="260" width="210" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="695" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">postgres</text>
  <text x="695" y="308" text-anchor="middle" font-size="11" fill="#c2410c">PostgreSQL 16</text>
  <text x="695" y="324" text-anchor="middle" font-size="11" fill="#c2410c">Flyway migrations</text>
  <text x="695" y="340" text-anchor="middle" font-size="11" fill="#c2410c">postgres_data volume</text>
  <text x="695" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">host :5433 -&gt; :5432</text>

  <!-- Arrows: Browser -> Frontend -->
  <path d="M 400 150 L 220 260" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="270" y="200" font-size="11" fill="#374151">loads SPA</text>

  <!-- Arrows: Browser -> Backend -->
  <path d="M 450 150 L 450 260" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="459" y="205" font-size="11" fill="#374151">REST /api + JWT</text>

  <!-- Arrows: Backend -> PostgreSQL -->
  <path d="M 555 320 L 590 320" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#arrow)" />
  <text x="558" y="312" font-size="10" fill="#374151">JDBC</text>

  <text x="450" y="425" text-anchor="middle" font-size="12" fill="#374151">PostgreSQL healthy → backend /actuator/health healthy → frontend starts</text>
  <!-- Legend / notes -->
  <text x="80" y="480" font-size="11" fill="#6b7280">frontend and backend are built from their own Dockerfile (multi-stage); postgres uses the official image.</text>
  <text x="80" y="498" font-size="11" fill="#6b7280">Production: frontend deploys to Vercel (VITE_API_URL env var); backend deploys separately (URL confirmed once live).</text>
</svg>
